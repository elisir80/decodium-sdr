<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    DECODIUM SDR — icona.

    Dice «radio definita dal software» senza scriverlo: sopra la traccia
    dello spettro, sotto le righe del waterfall che scorrono verso il basso e
    sbiadiscono nel tempo. Sono le due cose che si vedono aprendo un client
    SDR e nessun'altra categoria di programmi mette insieme.

    La riga di sintonia attraversa entrambi, com'è nell'applicazione: è ciò
    che lega quello che si vede a quello che si ascolta.

    Colori del tema: fondo #0B0F14, accento #4FC3F7, e la scala del waterfall
    dal blu profondo al giallo — la stessa che l'occhio impara a leggere
    guardando la banda.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0.06"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD24D" stop-opacity="1"/>
      <stop offset="18%"  stop-color="#7FE3FF" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#3B82D6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#16233A" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="fallWeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7FE3FF" stop-opacity="0.8"/>
      <stop offset="60%"  stop-color="#2B6CB0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#16233A" stop-opacity="0.12"/>
    </linearGradient>

    <clipPath id="round">
      <rect x="0" y="0" width="256" height="256" rx="56" ry="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="256" height="256" fill="#0B0F14"/>

    <!-- Alone della portante: la banda non è mai davvero silenziosa. -->
    <ellipse cx="128" cy="104" rx="104" ry="60" fill="url(#glow)"/>

    <!-- ── Spettro ──────────────────────────────────────────────────────
         Un fondo irregolare con tre segnali che emergono: quello centrale
         è forte e largo, gli altri due sono deboli, come in una banda vera.
    -->
    <path fill="url(#sky)" stroke="none"
          d="M 20 132
             L 20 124 L 26 127 L 31 120 L 36 126 L 41 118 L 46 125
             L 52 110 L 55 96 L 58 110 L 62 123
             L 68 119 L 73 126 L 78 117 L 83 124
             L 92 120 L 98 104 L 104 78 L 110 52 L 116 40 L 122 34
             L 128 32 L 134 34 L 140 40 L 146 52 L 152 78 L 158 104 L 164 120
             L 172 123 L 177 116 L 182 124 L 187 118
             L 194 122 L 198 100 L 201 86 L 204 100 L 208 122
             L 214 117 L 220 125 L 226 119 L 232 126 L 236 122
             L 236 132 Z"/>

    <path fill="none" stroke="#7FE3FF" stroke-width="2.4"
          stroke-linejoin="round" stroke-linecap="round"
          d="M 20 124 L 26 127 L 31 120 L 36 126 L 41 118 L 46 125
             L 52 110 L 55 96 L 58 110 L 62 123
             L 68 119 L 73 126 L 78 117 L 83 124
             L 92 120 L 98 104 L 104 78 L 110 52 L 116 40 L 122 34
             L 128 32 L 134 34 L 140 40 L 146 52 L 152 78 L 158 104 L 164 120
             L 172 123 L 177 116 L 182 124 L 187 118
             L 194 122 L 198 100 L 201 86 L 204 100 L 208 122
             L 214 117 L 220 125 L 226 119 L 232 126 L 236 122"/>

    <!-- ── Waterfall ────────────────────────────────────────────────────
         Righe che scendono e sbiadiscono: il tempo che passa. Le tracce dei
         segnali restano visibili come scie, che è il motivo per cui il
         waterfall serve.
    -->
    <g clip-path="url(#round)">
      <!-- Il fondo della banda: non è nero, è rumore. -->
      <rect x="20" y="146" width="216" height="86" fill="#16233A" opacity="0.85"/>
      <rect x="20" y="146" width="216" height="86" fill="url(#fallWeak)" opacity="0.35"/>

      <!-- scia del segnale forte, che si allarga scendendo -->
      <path fill="url(#fall)"
            d="M 122 146 L 134 146 L 139 232 L 117 232 Z" opacity="0.95"/>
      <!-- due scie deboli, una interrotta: la stazione che va e viene -->
      <path fill="url(#fallWeak)" d="M 53 146 L 58 146 L 61 232 L 50 232 Z" opacity="0.9"/>
      <path fill="url(#fallWeak)" d="M 199 146 L 204 146 L 207 202 L 196 202 Z" opacity="0.8"/>
      <path fill="url(#fallWeak)" d="M 78 146 L 81 146 L 83 178 L 76 178 Z" opacity="0.55"/>

      <!-- righe orizzontali: il passo con cui il waterfall avanza -->
      <g stroke="#0B0F14" stroke-width="1" opacity="0.22">
        <line x1="20" y1="160" x2="236" y2="160"/>
        <line x1="20" y1="176" x2="236" y2="176"/>
        <line x1="20" y1="192" x2="236" y2="192"/>
        <line x1="20" y1="208" x2="236" y2="208"/>
        <line x1="20" y1="224" x2="236" y2="224"/>
      </g>
    </g>

    <!-- ── Riga di sintonia ─────────────────────────────────────────────
         Attraversa spettro e waterfall, come nell'applicazione: è il punto
         che si sta ascoltando.
    -->
         Spessa 3 e non 2: a 16 px una riga da 2/256 non arriva a coprire un
         pixel intero e sbiadisce fino a sparire, e l'icona piccola perde
         proprio l'elemento che la lega all'applicazione.
    -->
    <line x1="128" y1="22" x2="128" y2="236"
          stroke="#FFB34D" stroke-width="3" opacity="0.92"/>
    <circle cx="128" cy="24" r="6" fill="#FFB34D"/>

    <!-- Bordo: stacca l'icona dallo sfondo del sistema, chiaro o scuro. -->
    <rect x="1" y="1" width="254" height="254" rx="55" ry="55"
          fill="none" stroke="#4FC3F7" stroke-width="2" opacity="0.35"/>
  </g>
</svg>
