# Il deploy di Qt installa plugin e moduli QML sotto share/qt6/, mentre su
# Windows Qt li cercherebbe accanto all'eseguibile. Questo file, copiato in
# bin/, riconcilia le due cose: senza, l'applicazione esce in silenzio perché
# non trova il plugin della piattaforma.
[Paths]
Prefix = ..
Plugins = share/qt6/plugins
Qml2Imports = share/qt6/qml
Translations = share/qt6/translations
