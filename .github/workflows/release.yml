# Pacchetti di release (RNF-04): un binario per piattaforma.
#
# Si attiva su un tag `v*` e pubblica una release in bozza con AppImage, DMG e
# ZIP portable. La bozza è voluta: le note di rilascio le scrive una persona,
# e il pacchetto va provato prima di renderlo pubblico.
name: Release

on:
  push:
    tags: ['v*']
  # Senza input: la versione viene dal progetto, e un campo obbligatorio che
  # nessuno step legge è solo un ostacolo fra chi vuole provare il
  # confezionamento e il workflow. Lanciato a mano costruisce i tre pacchetti
  # e li carica come artifact, senza creare alcuna release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage (x86-64)
            os: ubuntu-24.04
            artifact: decodium-sdr-linux-x86_64.AppImage
          - name: macOS DMG (Apple Silicon)
            os: macos-14
            artifact: decodium-sdr-macos-arm64.dmg
          - name: Windows (installer + ZIP)
            os: windows-latest
            artifact: decodium-sdr-windows-x86_64-setup.exe

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v4

      # ── Dipendenze ──────────────────────────────────────────────────────
      - name: Dipendenze di sistema (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libfftw3-dev libsoapysdr-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libegl1-mesa-dev libfuse2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libpulse-dev

      - name: Qt 6.8 (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtmultimedia qtserialport qtshadertools'
          cache: true

      - name: Dipendenze (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          brew update
          brew install qt@6 fftw ninja soapysdr soapyrtlsdr
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Dipendenze (Windows/MSYS2)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-soapysdr
            mingw-w64-x86_64-nsis
            zip

      # La libreria del ColibriNANO. È del costruttore ma è rilasciata sotto
      # Unlicense — «free to copy, publish, distribute... either in source code
      # form or as a compiled binary» — quindi può stare nei nostri pacchetti,
      # e senza di lei chi installa un pacchetto e collega la radio non vede
      # niente: il backend c'è, non trova device, e l'elenco resta vuoto.
      #
      # Si scarica invece di vivere nel repository, perché un binario di terzi
      # versionato è un binario che nessuno riguarda più. Ma non si prende alla
      # cieca: l'impronta è fissata qui, e se il file all'origine cambia la
      # costruzione si ferma. Stiamo mettendo codice di qualcun altro dentro
      # un pacchetto che firmiamo noi.
      #
      # macOS non ha una versione della libreria: là il ColibriNANO non è
      # supportato dal costruttore, e non c'è niente da includere.
      - name: Libreria ColibriNANO
        if: matrix.os != 'macos-14'
        shell: bash
        run: |
          BASE=https://raw.githubusercontent.com/maksimus1210/ColibriNANO_lib/master/library
          mkdir -p third_party/colibrinano
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            URL="$BASE/x64/colibrinano_lib.dll"
            OUT=third_party/colibrinano/colibrinano_lib.dll
            WANT=8caa01142accc37b48dbc0fa7a1cf4c87e8c73ca2a1711d731a6d3cdc751c1dd
          else
            # Nel repository d'origine `libcolibrinano_lib.so` è un puntatore
            # di ventisette byte: il file vero è quello con la versione piena.
            URL="$BASE/linux64/libcolibrinano_lib.so.1.0.0"
            OUT=third_party/colibrinano/libcolibrinano_lib.so
            WANT=77717b068164a1db10f623450aae8b3f216dda93d9856112fe7096918f20f585
          fi

          curl -fsSL "$URL" -o "$OUT"
          GOT=$(sha256sum "$OUT" | cut -d' ' -f1)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::colibrinano_lib non è quella attesa"
            echo "  attesa:  $WANT"
            echo "  scaricata: $GOT"
            exit 1
          fi
          echo "colibrinano_lib verificata: $GOT"

      # Il motore della riduzione di rumore neurale. Il sorgente non sta nel
      # repository — è di Xiph, e un sorgente altrui versionato è un sorgente
      # che nessuno riguarda più — ma la licenza è BSD-3, che consente la
      # ridistribuzione anche in forma binaria: compilato dentro il nostro
      # eseguibile, ci può stare.
      #
      # Senza questo passo il pacchetto esce senza lo stadio neurale, e chi lo
      # installa non trova il filtro: è successo dalla 1.1.3 alla 1.1.8, e il
      # programma lo diceva in una riga di log che su Windows non legge
      # nessuno.
      #
      # Il commit è fissato: «l'ultimo disponibile» in un pacchetto pubblicato
      # significa che due release con lo stesso numero possono contenere due
      # motori diversi. I pesi del modello li verifica lo script del progetto
      # con lo sha256 che si porta dietro.
      - name: Motore neurale (RNNoise)
        shell: bash
        run: |
          RNNOISE_COMMIT=70f1d256acd4b34a572f999a05c87bf00b67730d
          git clone https://github.com/xiph/rnnoise third_party/rnnoise
          cd third_party/rnnoise

          # Il commit deve esserci: ripiegare sul ramo predefinito vorrebbe
          # dire pubblicare un motore diverso da quello provato, e non
          # accorgersene.
          git checkout --quiet "$RNNOISE_COMMIT"

          # Il download del modello con curl invece dello script del progetto,
          # che vuole wget: su MSYS2 e su macOS non c'è di serie, e installarlo
          # per un file solo è una dipendenza in più da mantenere.
          MODEL_HASH=$(cat model_version)
          MODEL="rnnoise_data-${MODEL_HASH}.tar.gz"
          curl -fsSL "https://media.xiph.org/rnnoise/models/${MODEL}" -o "$MODEL"

          GOT=$(sha256sum "$MODEL" | cut -d' ' -f1)
          if [ "$GOT" != "$MODEL_HASH" ]; then
            echo "::error::i pesi di RNNoise non sono quelli attesi"
            echo "  atteso:    $MODEL_HASH"
            echo "  scaricato: $GOT"
            exit 1
          fi
          tar xzf "$MODEL"
          echo "RNNoise pronto: $(git rev-parse --short HEAD), modello verificato"

      # ── Build e installazione ───────────────────────────────────────────
      - name: Compila
        run: |
          QT_DEPLOY_ARG=""
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            # Qt 6.11/macdeployqt has a broken CMake-generated QML plugin
            # symlink path on this runner; deploy the finished app explicitly.
            QT_DEPLOY_ARG="-DDSDR_QT_CMAKE_DEPLOY=OFF"
          fi
          # `DSDR_STRICT_BACKENDS`: qui si costruisce per altri, e un backend
          # che si spegne perché manca una dipendenza deve fermare la
          # costruzione. La 1.1.3 è uscita senza `audiorig` — niente CAT,
          # nessuna radio tradizionale — perché la riga che lo diceva era una
          # fra trecento e nessuno l'ha letta.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DDSDR_STRICT_BACKENDS=ON $QT_DEPLOY_ARG
          cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 180

      - name: Installa in staging
        shell: bash
        run: |
          # Il prefix deve essere assoluto: `qt6_deploy_qt_conf` rifiuta un
          # percorso relativo, e il messaggio arriva dopo che l'installazione
          # ha già copiato mezza Qt. Su MSYS2 serve anche la forma Windows,
          # perché cmake lì è un binario nativo.
          PREFIX="$(pwd)/staging"
          if command -v cygpath >/dev/null 2>&1; then
            PREFIX="$(cygpath -m "$PREFIX")"
          fi
          cmake --install build --prefix "$PREFIX"

          if [ "${{ matrix.os }}" = "macos-14" ]; then
            macdeployqt "$PREFIX/decodium-sdr.app" \
              -qmldir="$PWD/src/app/qml" -no-codesign -always-overwrite
            cmake -DCMAKE_INSTALL_PREFIX="$PREFIX" \
              -P build/BundleMacOSSoapyRtlSdr.cmake
            # macdeployqt and the custom RTL-SDR step both rewrite Mach-O
            # files. Remove any linker/ad-hoc signatures left by Homebrew or
            # Qt after those rewrites; otherwise macOS can terminate the
            # bundle with "Code Signature Invalid". A notarized release must
            # replace this with one final Developer ID signing pass.
            find "$PREFIX/decodium-sdr.app/Contents" -type f \
              \( -name '*.dylib' -o -name '*.so' -o -path '*/MacOS/*' \) \
              -exec codesign --remove-signature {} \; 2>/dev/null || true
          fi

      # Il pacchetto Windows è l'unico che si costruisce dove tutte le
      # librerie sono già nel PATH: MSYS2 le fornisce a chiunque, e un
      # pacchetto incompleto parte lo stesso su questa macchina. Chi scopre
      # che mancano è l'utente, all'avvio, con il nome di una DLL che non gli
      # dice niente. Il controllo rifà quel percorso qui, dove costa un
      # secondo e non è ancora partito niente verso nessuno.
      - name: Il pacchetto Windows è autosufficiente
        if: matrix.os == 'windows-latest'
        run: bash scripts/check-windows-package.sh staging

      # ── Confezionamento ─────────────────────────────────────────────────
      - name: AppImage (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          # AppDir con la struttura che linuxdeploy si aspetta.
          mkdir -p AppDir/usr
          cp -r staging/* AppDir/usr/

          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cat > AppDir/usr/share/applications/it.decodium.sdr.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DECODIUM SDR
          Comment=Client SDR universale dell'ecosistema DECODIUM
          Exec=decodium-sdr
          Icon=it.decodium.sdr
          Categories=HamRadio;Network;AudioVideo;
          Terminal=false
          EOF

          # L'icona è un file versionato, non qualcosa che la CI debba saper
          # produrre: generarla al volo dipendeva da ImageMagick, che su
          # ubuntu-24.04 non c'è, e il ripiego lasciava un PNG di zero byte che
          # linuxdeploy rifiuta — dopo aver già fatto tutto il resto del lavoro.
          cp packaging/icons/it.decodium.sdr.png AppDir/usr/share/icons/hicolor/256x256/apps/

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export QML_SOURCES_PATHS="$PWD/src/app/qml"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            --output appimage --executable AppDir/usr/bin/decodium-sdr \
            --desktop-file AppDir/usr/share/applications/it.decodium.sdr.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/it.decodium.sdr.png

          mv *.AppImage ${{ matrix.artifact }} 2>/dev/null || \
            mv DECODIUM*.AppImage ${{ matrix.artifact }}

      - name: DMG (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          # Solo `staging`: nella build tree c'è un secondo bundle, quello
          # appena linkato, in cui le librerie Qt non sono ancora entrate.
          # Prenderlo darebbe un DMG che si apre, mostra l'icona e non parte su
          # nessuna macchina che non abbia già Qt installato.
          APP=$(find staging -name "decodium-sdr.app" -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then
            echo "::error::bundle .app non trovato in staging/"; exit 1
          fi

          RTLSDR_MODULE="$APP/Contents/PlugIns/SoapySDR/modules0.8/librtlsdrSupport.so"
          if [ ! -f "$RTLSDR_MODULE" ]; then
            echo "::error::modulo SoapyRTLSDR assente dal bundle macOS"; exit 1
          fi
          test -f "$APP/Contents/Frameworks/librtlsdr.0.dylib"
          test -f "$APP/Contents/Frameworks/libusb-1.0.0.dylib"
          echo "SoapyRTLSDR e runtime USB presenti nel bundle"

          mkdir -p dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications

          hdiutil create -volname "DECODIUM SDR" -srcfolder dmgroot \
            -ov -format UDZO "${{ matrix.artifact }}"

          # Il DMG non è firmato né notarizzato: serve un Developer ID, che è
          # un passo amministrativo, non tecnico. Fino ad allora macOS
          # chiederà conferma all'apertura.
          echo "::warning::DMG non firmato: serve un Apple Developer ID per la notarizzazione"

      - name: Installer e ZIP (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # L'installatore lo fa CPack, dalla stessa regola di `install()` da
          # cui esce lo staging: due strade diverse per lo stesso contenuto
          # diventerebbero due pacchetti diversi al primo ritocco.
          cd build
          cpack -G "NSIS;ZIP"
          cd ..

          mv build/decodium-sdr-*-Windows-*.exe "${{ matrix.artifact }}"
          mv build/decodium-sdr-*-Windows-*.zip decodium-sdr-windows-x86_64.zip

      # L'installatore Inno Setup, lo stesso strumento con cui si confeziona
      # DECODIUM: chi installa i due programmi incontra la stessa procedura.
      # Si costruisce qui e non sulla macchina di chi sviluppa perché il
      # contenuto dev'essere quello di release — la build locale porta i
      # simboli di debug e pesa il doppio — e perché un pacchetto pubblicato
      # deve venire dallo stesso posto degli altri.
      #
      # ISCC è preinstallato sui runner Windows di GitHub. Il percorso è
      # quello di sistema e non passa dal PATH di MSYS2, che non lo conosce.
      - name: Installatore Inno Setup (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            echo "::error::Inno Setup non trovato sul runner"
            exit 1
          fi

          VERSION=$(grep -m1 'VERSION' CMakeLists.txt | tr -dc '0-9.')
          "$ISCC" //DStagingDir="$(cygpath -w "$(pwd)/staging")"                   //DAppVersion="$VERSION"                   packaging/windows/decodium-sdr.iss

          mv "packaging/windows/DECODIUM_SDR_${VERSION}_x64_Setup.exe"              decodium-sdr-windows-x86_64-innosetup.exe

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: decodium-sdr-windows-x86_64-innosetup.exe
          path: decodium-sdr-windows-x86_64-innosetup.exe
          retention-days: 14

      - name: Carica anche lo ZIP portable (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: decodium-sdr-windows-x86_64.zip
          path: decodium-sdr-windows-x86_64.zip
          retention-days: 14

      # ── Verifica minima del pacchetto ───────────────────────────────────
      - name: Il pacchetto ha una dimensione plausibile
        shell: bash
        run: |
          ls -lh "${{ matrix.artifact }}"

          # `test -s` verificava solo che il file non fosse vuoto, e un DMG da
          # 900 kB — bundle senza una sola libreria Qt dentro — passava il
          # controllo per poi non partire su nessuna macchina. Un pacchetto che
          # si porta dietro Qt non può stare sotto i venti megabyte: la soglia
          # non dice che il contenuto è giusto, ma coglie il caso in cui manca
          # tutto, che è esattamente come falliscono questi passaggi.
          BYTES=$(wc -c < "${{ matrix.artifact }}")
          MIN=$((20 * 1024 * 1024))
          if [ "$BYTES" -lt "$MIN" ]; then
            echo "::error::pacchetto di soli $((BYTES / 1024)) kB: le librerie non ci sono"
            exit 1
          fi
          echo "$((BYTES / 1024 / 1024)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 14

  publish:
    name: Pubblica la bozza di release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crea la bozza
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## DECODIUM SDR ${{ github.ref_name }}

            Pacchetti per Linux (AppImage), macOS (DMG) e Windows — installatore
            e ZIP portable.

            > Il DMG non è ancora firmato né notarizzato: al primo avvio macOS
            > chiederà conferma. Serve un Apple Developer ID.

            Le note qui sotto sono generate automaticamente: sostituirle prima
            di pubblicare.
