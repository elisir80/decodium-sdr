# Pacchetti di release (RNF-04): un binario per piattaforma.
#
# Si attiva su un tag `v*` e pubblica una release in bozza con AppImage, DMG e
# ZIP portable. La bozza è voluta: le note di rilascio le scrive una persona,
# e il pacchetto va provato prima di renderlo pubblico.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da costruire (senza la v)"
        required: true

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage (x86-64)
            os: ubuntu-24.04
            artifact: decodium-sdr-linux-x86_64.AppImage
          - name: macOS DMG (Apple Silicon)
            os: macos-14
            artifact: decodium-sdr-macos-arm64.dmg
          - name: Windows ZIP portable
            os: windows-latest
            artifact: decodium-sdr-windows-x86_64.zip

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v4

      # ── Dipendenze ──────────────────────────────────────────────────────
      - name: Dipendenze di sistema (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libfftw3-dev libsoapysdr-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libegl1-mesa-dev libfuse2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libpulse-dev

      - name: Qt 6.8 (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtmultimedia qtshadertools'
          cache: true

      - name: Dipendenze (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          brew update
          brew install qt@6 fftw ninja soapysdr
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Dipendenze (Windows/MSYS2)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-soapysdr
            zip

      # ── Build e installazione ───────────────────────────────────────────
      - name: Compila
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 180

      - name: Installa in staging
        run: cmake --install build --prefix staging

      # ── Confezionamento ─────────────────────────────────────────────────
      - name: AppImage (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          # AppDir con la struttura che linuxdeploy si aspetta.
          mkdir -p AppDir/usr
          cp -r staging/* AppDir/usr/

          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cat > AppDir/usr/share/applications/it.decodium.sdr.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DECODIUM SDR
          Comment=Client SDR universale dell'ecosistema DECODIUM
          Exec=decodium-sdr
          Icon=it.decodium.sdr
          Categories=HamRadio;Network;AudioVideo;
          Terminal=false
          EOF

          # Segnaposto: l'icona vera arriverà con l'identità visiva.
          convert -size 256x256 xc:'#070B11' -fill '#6EE7FF' -pointsize 48 \
                  -gravity center -annotate 0 'DSDR' \
                  AppDir/usr/share/icons/hicolor/256x256/apps/it.decodium.sdr.png \
            || touch AppDir/usr/share/icons/hicolor/256x256/apps/it.decodium.sdr.png

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export QML_SOURCES_PATHS="$PWD/src/app/qml"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            --output appimage --executable AppDir/usr/bin/decodium-sdr \
            --desktop-file AppDir/usr/share/applications/it.decodium.sdr.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/it.decodium.sdr.png

          mv *.AppImage ${{ matrix.artifact }} 2>/dev/null || \
            mv DECODIUM*.AppImage ${{ matrix.artifact }}

      - name: DMG (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          # Il bundle .app viene prodotto dal deploy di Qt in fase di build.
          APP=$(find build staging -name "decodium-sdr.app" -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then
            echo "::error::bundle .app non trovato"; exit 1
          fi

          mkdir -p dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications

          hdiutil create -volname "DECODIUM SDR" -srcfolder dmgroot \
            -ov -format UDZO "${{ matrix.artifact }}"

          # Il DMG non è firmato né notarizzato: serve un Developer ID, che è
          # un passo amministrativo, non tecnico. Fino ad allora macOS
          # chiederà conferma all'apertura.
          echo "::warning::DMG non firmato: serve un Apple Developer ID per la notarizzazione"

      - name: ZIP portable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mv staging decodium-sdr
          zip -qr "${{ matrix.artifact }}" decodium-sdr

      # ── Verifica minima del pacchetto ───────────────────────────────────
      - name: Il pacchetto contiene l'eseguibile
        shell: bash
        run: |
          ls -lh "${{ matrix.artifact }}"
          test -s "${{ matrix.artifact }}" || { echo "::error::pacchetto vuoto"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 14

  publish:
    name: Pubblica la bozza di release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crea la bozza
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## DECODIUM SDR ${{ github.ref_name }}

            Pacchetti per Linux (AppImage), macOS (DMG) e Windows (ZIP portable).

            > Il DMG non è ancora firmato né notarizzato: al primo avvio macOS
            > chiederà conferma. Serve un Apple Developer ID.

            Le note qui sotto sono generate automaticamente: sostituirle prima
            di pubblicare.
