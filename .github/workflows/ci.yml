# CI di DECODIUM SDR — merge gate di CONSTITUTION §1.
#
# Verde su Linux, macOS e Windows è condizione necessaria per il merge. Non è
# sufficiente: serve anche la review umana, che GitHub applica via CODEOWNERS.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Regole architetturali verificabili meccanicamente ─────────────────────
  # Girano per prime e in pochi secondi: se il seam è stato violato non ha
  # senso spendere venti minuti di build su tre piattaforme.
  architecture:
    name: Regole architetturali
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nessun backend incluso sopra la HAL (CONSTITUTION §4)
        run: |
          if grep -rn "hal/backends/" src/core src/audio src/app; then
            echo "::error::Un modulo sopra la HAL include un backend concreto."
            exit 1
          fi
          echo "OK: il seam è rispettato."

      - name: Nessun ramo sul tipo di backend in QML (CONSTITUTION §7)
        run: |
          if grep -rnE 'backendId *[=!]==' src/app/qml; then
            echo "::error::La UI ramifica sul backend invece che sulle capability."
            exit 1
          fi
          echo "OK: la UI si genera dalle capability."

      - name: Nessun colore letterale in QML (CONSTITUTION §6)
        run: |
          # Theme.qml è la sola sede legittima dei valori di colore.
          if grep -rnE '"#[0-9a-fA-F]{3,8}"' src/app/qml --exclude=Theme.qml; then
            echo "::error::Colore hardcoded fuori dal singleton Theme."
            exit 1
          fi
          echo "OK: i colori vengono tutti da Theme."

      - name: third_party/ solo con licenze dichiarate (CONSTITUTION §3)
        run: |
          for dir in third_party/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if [ ! -f "$dir/LICENSE" ] && [ ! -f "$dir/COPYING" ]; then
              echo "::error::$name è vendorizzato senza file di licenza."
              exit 1
            fi
            if ! grep -q "$name" THIRD_PARTY_LICENSES; then
              echo "::error::$name non è registrato in THIRD_PARTY_LICENSES."
              exit 1
            fi
          done
          echo "OK: nessun vendoring non dichiarato."

  # ── Build e test ──────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.name }}
    needs: architecture
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86-64)
            os: ubuntu-24.04
          - name: macOS (Apple Silicon)
            os: macos-14
          - name: Windows (MSYS2 / MinGW)
            os: windows-latest

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v4

      # ── Dipendenze ──────────────────────────────────────────────────────
      # Ubuntu 24.04 si ferma a Qt 6.4, sotto il floor 6.8 di RNF-01:
      # QQuickRhiItem esiste solo da 6.7. Si installa un Qt aggiornato.
      - name: Dipendenze di sistema (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libfftw3-dev libsoapysdr-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libegl1-mesa-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libpulse-dev

      - name: Qt 6.8 (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtmultimedia qtserialport qtshadertools'
          cache: true

      - name: Dipendenze (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          brew update
          brew install qt@6 fftw ninja soapysdr soapyrtlsdr
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Dipendenze (Windows/MSYS2)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-soapysdr

      # Il motore della riduzione di rumore neurale. Il sorgente non sta nel
      # repository — è di Xiph, e un sorgente altrui versionato è un sorgente
      # che nessuno riguarda più — ma la licenza è BSD-3, che consente la
      # ridistribuzione anche in forma binaria: compilato dentro il nostro
      # eseguibile, ci può stare.
      #
      # Senza questo passo il pacchetto esce senza lo stadio neurale, e chi lo
      # installa non trova il filtro: è successo dalla 1.1.3 alla 1.1.8, e il
      # programma lo diceva in una riga di log che su Windows non legge
      # nessuno.
      #
      # Il commit è fissato: «l'ultimo disponibile» in un pacchetto pubblicato
      # significa che due release con lo stesso numero possono contenere due
      # motori diversi. I pesi del modello li verifica lo script del progetto
      # con lo sha256 che si porta dietro.
      - name: Motore neurale (RNNoise)
        shell: bash
        run: |
          RNNOISE_COMMIT=70f1d256acd4b34a572f999a05c87bf00b67730d
          git clone https://github.com/xiph/rnnoise third_party/rnnoise
          cd third_party/rnnoise

          # Il commit deve esserci: ripiegare sul ramo predefinito vorrebbe
          # dire pubblicare un motore diverso da quello provato, e non
          # accorgersene.
          git checkout --quiet "$RNNOISE_COMMIT"

          # Il download del modello con curl invece dello script del progetto,
          # che vuole wget: su MSYS2 e su macOS non c'è di serie, e installarlo
          # per un file solo è una dipendenza in più da mantenere.
          MODEL_HASH=$(cat model_version)
          MODEL="rnnoise_data-${MODEL_HASH}.tar.gz"
          curl -fsSL "https://media.xiph.org/rnnoise/models/${MODEL}" -o "$MODEL"

          GOT=$(sha256sum "$MODEL" | cut -d' ' -f1)
          if [ "$GOT" != "$MODEL_HASH" ]; then
            echo "::error::i pesi di RNNoise non sono quelli attesi"
            echo "  atteso:    $MODEL_HASH"
            echo "  scaricato: $GOT"
            exit 1
          fi
          tar xzf "$MODEL"
          echo "RNNoise pronto: $(git rev-parse --short HEAD), modello verificato"

      # ── Build ───────────────────────────────────────────────────────────
      - name: Configura
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DDSDR_WARNINGS_AS_ERRORS=ON

      - name: Compila
        run: cmake --build build

      # ── Test ────────────────────────────────────────────────────────────
      # Headless ovunque: la conformance suite e gli integration test girano
      # contro il backend demo, che non richiede hardware (CONSTITUTION §9).
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: null
        run: ctest --test-dir build --output-on-failure --timeout 180

      - name: Diagnostica in caso di fallimento
        if: failure()
        run: |
          echo "--- CMakeConfigureLog ---"
          tail -n 120 build/CMakeFiles/CMakeConfigureLog.yaml 2>/dev/null || true
          echo "--- LastTest.log ---"
          tail -n 200 build/Testing/Temporary/LastTest.log 2>/dev/null || true
